name = "FC100"
defaultTargets = ["FC100Solved", "FC100Open"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "formal_conjectures"
git = "https://github.com/google-deepmind/formal-conjectures.git"
rev = "7a41db3d761324599812d6ca6cb6a9f311046dc7"

[[lean_lib]]
name = "FC100Solved"
[lean_lib.leanOptions]
warn.sorry = false

[[lean_lib]]
name = "FC100Open"
[lean_lib.leanOptions]
warn.sorry = false
